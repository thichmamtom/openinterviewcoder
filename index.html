<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' file:"
    />
    <link href="styles.css" rel="stylesheet" />
    <title>Invisible Assistant</title>
  </head>
  <body>
    <div id="invisible-container">
      <!-- Chat area -->
      <div class="chat-container">
        <div id="null-state" class="null-state">
          <div class="null-state-content">
            <!-- octo logo -->
            <div class="octo-logo">
              <img src="assets/OCTO.png" alt="Octo" />
            </div>
            <h4>Open Interview Coder</h4>
            <div class="shortcuts">
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>H</kbd>
                <span>Take a screenshot</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>C</kbd>
                <span>Send selection to AI</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>V</kbd>
                <span>Listen to system audio</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>H</kbd>
                <span>Hide window</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>←/→/↑/↓</kbd>
                <span>Move window</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>,</kbd>
                <span>Open settings</span>
              </div>
              <div class="shortcut-item">
                <kbd>⌘</kbd> + <kbd>⇧</kbd> + <kbd>M</kbd>
                <span>Toggle mouse passthrough</span>
              </div>
            </div>
          </div>
        </div>
        <div id="chat-history"></div>
      </div>
      <div
        id="speech-status"
        class="speech-status"
        role="status"
        aria-live="polite"
        hidden
      ></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="src/renderer.js" defer></script>
  </body>
</html>
